# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      contentImageSupported:
        type: boolean
        default: true
        description: For the legacy `generate` tool only. Set to false for clients that can't
          display images; `generate` then saves files and requires 'name' and 'folder'.
      outputDir:
        type: string
        description: If set, files may only be written inside this directory.
  commandFunction:
    # Produces the command that starts the server on stdio
    |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        CONTENT_IMAGE_SUPPORTED: config.contentImageSupported === false ? 'false' : 'true',
        ...(config.outputDir ? { MERMAID_OUTPUT_DIR: config.outputDir } : {})
      }
    })
  exampleConfig:
    contentImageSupported: true
