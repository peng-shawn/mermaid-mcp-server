name: Publish to npm

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage publish to npm
        # Authenticates via npm trusted publishing; no token needed.
        # The staged version goes live only after a maintainer approves it
        # with 2FA (npm stage approve <stage-id>, or on npmjs.com).
        run: npm stage publish --provenance --access public 